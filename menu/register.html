<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Register | Skibidi Web</title>
    <style>
        body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; color: white; }
        .card { background: rgba(255,255,255,0.1); padding: 30px; border-radius: 15px; width: 300px; text-align: center; border: 1px solid rgba(255,255,255,0.2); }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #4466ff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>👤Register</h2>
        <form id="regForm">
            <input type="text" id="new_user" placeholder="Create Username" required>
            <input type="password" id="new_pass" placeholder="Create Password" required>
            <button type="submit">Confirm Registration</button>
        </form>
        <p style="font-size: 0.8rem; margin-top: 15px;">Already have an account? <a href="login.html" style="color: #4466ff;">Back to Login</a></p>
    </div>

    <script>
        document.getElementById('regForm').onsubmit = function(e) {
            e.preventDefault();
            const user = document.getElementById('new_user').value;
            const pass = document.getElementById('new_pass').value;

            // บันทึกข้อมูลลงเบราว์เซอร์
            localStorage.setItem('saved_user', user);
            localStorage.setItem('saved_pass', pass);

            alert('Registration successful! Your credentials have been saved.');
            window.location.href = 'login.html'; // สมัครเสร็จส่งไปหน้า login
        };
    </script>
</body>
</html>
